[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/flights"
  to = "/.netlify/functions/flights"
  status = 200

[[redirects]]
  from = "/api/calendar"
  to = "/.netlify/functions/calendar"
  status = 200

[[redirects]]
  from = "/api/flex"
  to = "/.netlify/functions/flex"
  status = 200
